<title>Linden Row</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Libre+Franklin:wght@400;500;600&display=swap">
<style>
/* Layout: centered masthead over a quiet product grid; garments drawn on pale tint tiles; one slate accent on white. */
:root {
  color-scheme: light;
  --paper: #ffffff;
  --tint: #f5f5f2;
  --tint-2: #ebebe6;
  --line: #e3e3de;
  --ink: #1c2230;
  --muted: #656b76;
  --accent: #2c3a4b;
  --accent-hover: #1f2a38;
  --on-accent: #ffffff;
  --ok: #33664a;
  --err: #a33a2e;
  --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --sans: 'Libre Franklin', 'Helvetica Neue', Arial, sans-serif;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.55;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  background: var(--paper); z-index: 30;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4 { font-family: var(--serif); font-weight: 500; margin: 0; text-wrap: balance; letter-spacing: 0.005em; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap {
  max-width: 1240px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.eyebrow { font-size: 11.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); font-weight: 500; }

/* announcement + header */
.announce { background: var(--accent); color: var(--on-accent); font-size: 12.5px; letter-spacing: 0.04em; text-align: center; }
.announce .wrap { padding-block: 8px; }
header.site {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--paper); border-bottom: 1px solid var(--line);
}
.bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 68px; gap: 12px; }
.logo { font-family: var(--serif); font-size: 30px; font-weight: 500; letter-spacing: 0.04em; background: none; border: 0; padding: 0; text-align: center; line-height: 1; }
.logo small { display: block; font-family: var(--sans); font-size: 9.5px; letter-spacing: 0.32em; text-transform: uppercase; color: var(--muted); margin-top: 5px; font-weight: 500; }
nav.main { display: none; gap: 22px; }
nav.main button { background: none; border: 0; padding: 6px 0; font-size: 13px; letter-spacing: 0.06em; border-bottom: 1px solid transparent; }
nav.main button:hover { border-bottom-color: var(--ink); }
.tools { display: flex; justify-content: flex-end; gap: 4px; }
.icon-btn { position: relative; background: none; border: 0; width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%; }
.icon-btn:hover { background: var(--tint); }
.icon-btn svg { width: 22px; height: 22px; fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.count { position: absolute; top: 3px; right: 1px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--accent); color: var(--on-accent); font-size: 10.5px; font-weight: 600; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.count[hidden] { display: none; }
@media (min-width: 860px) { nav.main { display: flex; } }

/* hero */
.hero { border-bottom: 1px solid var(--line); }
.hero .wrap { display: grid; gap: 40px; padding-block: 56px; align-items: center; }
.hero h1 { font-size: clamp(40px, 6.4vw, 72px); line-height: 1.02; margin: 14px 0 18px; }
.hero h1 em { font-style: italic; font-weight: 400; }
.hero p.lede { color: var(--muted); max-width: 46ch; font-size: 16px; }
.hero .cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
.hero-art { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; align-items: end; }
.hero-art .t { background: var(--tint); aspect-ratio: 3 / 4; display: block; }
.hero-art .t:nth-child(2) { aspect-ratio: 3 / 4.6; }
.hero-art svg { width: 100%; height: 100%; display: block; }
@media (min-width: 860px) { .hero .wrap { grid-template-columns: 1fr 1.1fr; gap: 64px; padding-block: 72px; } }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 26px; border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); font-size: 13px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; border-radius: 2px; }
.btn:hover { background: var(--accent-hover); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--ink); }
.btn.ghost:hover { background: var(--tint); }
.btn.block { width: 100%; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }

/* shop */
section.shop { padding-block: 56px 72px; }
.shop-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 24px; }
.shop-head h2 { font-size: clamp(32px, 4vw, 44px); }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; border-bottom: 1px solid var(--line); scrollbar-width: thin; }
.tab { flex: none; background: none; border: 0; padding: 12px 14px; font-size: 13.5px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -5px; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 500; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 18px 0; }
.field-search { position: relative; flex: 1 1 220px; min-width: 0; }
.field-search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; stroke: var(--muted); fill: none; stroke-width: 1.6; stroke-linecap: round; }
